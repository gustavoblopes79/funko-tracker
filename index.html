        type: 'button', class: 'chip chip-agrupar', 'aria-pressed': 'false',
        on: { click: () => { filtro.agrupar = !filtro.agrupar; Render.lista(tipo); } },
      }, 'Agrupar por série');
      const btnLimpar = el('button', {
        type: 'button', class: 'limpar-filtros', hidden: true,
        on: { click: () => { Estado.limparFiltros(tipo); Render.lista(tipo); } },
      }, 'Limpar filtros');
      const filtrosExtra = el('div', { class: 'filtros-extra', role: 'group', 'aria-label': 'Filtrar por grupo e série' },
        selGrupo, selSerie, btnAgrupar, btnLimpar);

      const barra = el('div', { class: 'barra-busca' }, el('div', { class: 'campo-busca' }, Util.icone('busca'), busca));
      const criarOrdem = (valor, texto) => el('button', {
        type: 'button', 'aria-pressed': 'false', dataset: { ordem: valor },
        on: { click: () => { Estado.filtros[tipo].ordem = valor; Render.lista(tipo); } },
      }, texto);
      const ordenacao = tipo === 'wishlist'
        ? el('div', { class: 'ordenacao', role: 'group', 'aria-label': 'Ordenar wishlist' },
          criarOrdem('recentes', 'Mais recentes'), criarOrdem('desejo', 'Maior desejo'))
        : null;
      Util.anexar(painel, [barra, chips, filtrosExtra, ordenacao, grade, vazio]);
      Interacoes.ligarCards(grade, tipo);
      return { barra, busca, chips, filtrosExtra, selGrupo, selSerie, btnAgrupar, btnLimpar, ordenacao, grade, vazio };
    },

    tudo() {
      Render.cabecalho();
      Render.lista('colecao');
      Render.lista('wishlist');
      Render.dashboard();
    },

    cabecalho() {
      const aba = Estado.aba;
      dom.titulo.textContent = ROTULOS[aba].titulo;
      dom.btnAdicionar.setAttribute('aria-label', ROTULOS[aba].adicionar);
      const nC = Estado.listas.colecao.length;
      const nW = Estado.listas.wishlist.length;
      if (aba === 'colecao') dom.subtitulo.textContent = nC ? `${Util.plural(nC, 'Funko', 'Funkos')} na estante` : 'Estante vazia';
      else if (aba === 'wishlist') dom.subtitulo.textContent = nW ? `${Util.plural(nW, 'Funko', 'Funkos')} para caçar` : 'Nada na mira ainda';
      else dom.subtitulo.textContent = `${Util.plural(nC + nW, 'Funko', 'Funkos')} catalogados`;
      for (const botao of dom.abas) {
        const ativa = botao.dataset.aba === aba;
        botao.setAttribute('aria-selected', String(ativa));
        botao.tabIndex = ativa ? 0 : -1;
      }
      for (const [nome, painel] of Object.entries(dom.paineis)) painel.hidden = nome !== aba;
    },

    lista(tipo) {
      const refs = dom.listas[tipo];
      const filtro = Estado.filtros[tipo];
      for (const chip of refs.chips.children) {
        chip.setAttribute('aria-pressed', String((chip.dataset.categoria || null) === filtro.categoria));
      }
      if (refs.busca.value !== filtro.busca) refs.busca.value = filtro.busca;
      const temItens = Estado.listas[tipo].length > 0;
      refs.barra.hidden = !temItens;
      refs.chips.hidden = !temItens;
      if (refs.ordenacao) {
        refs.ordenacao.hidden = !temItens;
        for (const botao of refs.ordenacao.children) {
          botao.setAttribute('aria-pressed', String(botao.dataset.ordem === filtro.ordem));
        }
      }

      const temSeries = Render.filtrosDeSerie(tipo, refs);
      refs.filtrosExtra.hidden = !temItens || (!temSeries && !Estado.temFiltro(tipo));

      const itens = Estado.visiveis(tipo);
      if (itens.length && filtro.agrupar && temSeries) {
        refs.grade.replaceChildren(...Render.secoes(itens, tipo));
      } else {
        refs.grade.replaceChildren(el('div', { class: 'grade', role: 'list' }, itens.map((i) => Render.card(i, tipo))));
      }
      refs.grade.hidden = itens.length === 0;
      refs.vazio.hidden = itens.length > 0;
      if (!itens.length) refs.vazio.replaceChildren(...Render.estadoVazio(tipo));
    },

    // Monta as opções de grupo e série com o que existe nesta lista. Devolve se há alguma série.
    filtrosDeSerie(tipo, refs) {
      const filtro = Estado.filtros[tipo];
      const usadas = new Map();
      for (const item of Estado.listas[tipo]) {
        const chave = Util.chaveSerie(item.serie);
        if (!chave || usadas.has(chave)) continue;
        const registrada = Series.doRegistro(item.serie);
        usadas.set(chave, {
          chave,
          nome: registrada ? registrada.nome : Util.limparSerie(item.serie),
          grupo: registrada ? registrada.grupo : Series.grupoDe(item.serie),
        });
      }
      const todas = Array.from(usadas.values());
      const grupos = GRUPOS.filter((g) => todas.some((u) => u.grupo === g.nome));
      if (filtro.grupo && !grupos.some((g) => g.nome === filtro.grupo)) filtro.grupo = null;
      const series = todas.filter((u) => !filtro.grupo || u.grupo === filtro.grupo).sort(Series.porNome);
      if (filtro.serie && !series.some((u) => u.chave === filtro.serie)) filtro.serie = null;

      refs.selGrupo.replaceChildren(el('option', { value: '', text: 'Todos os grupos' }),
        ...grupos.map((g) => el('option', { value: g.nome, text: g.nome })));
      refs.selGrupo.value = filtro.grupo || '';
      refs.selGrupo.classList.toggle('ativo', Boolean(filtro.grupo));
      refs.selSerie.replaceChildren(el('option', { value: '', text: 'Todas as séries' }),
        ...series.map((u) => el('option', { value: u.chave, text: u.nome })));
      refs.selSerie.value = filtro.serie || '';
      refs.selSerie.classList.toggle('ativo', Boolean(filtro.serie));

      const temSeries = todas.length > 0;
      refs.selGrupo.hidden = !temSeries;
      refs.selSerie.hidden = !temSeries;
      refs.btnAgrupar.hidden = !temSeries;
      refs.btnAgrupar.setAttribute('aria-pressed', String(filtro.agrupar));
      refs.btnLimpar.hidden = !Estado.temFiltro(tipo);
      return temSeries;
    },

    secoes(itens, tipo) {
      const blocos = new Map();
      for (const item of itens) {
        const chave = Util.chaveSerie(item.serie);
        if (!blocos.has(chave)) {
          const registrada = chave ? Series.doRegistro(item.serie) : null;
          blocos.set(chave, {
            nome: chave ? (registrada ? registrada.nome : Util.limparSerie(item.serie)) : 'Sem série',
            grupo: chave ? Series.grupoDe(item.serie) : null,
            itens: [],
          });
        }
        blocos.get(chave).itens.push(item);
      }
      return Array.from(blocos.entries())
        .sort(([ca, a], [cb, b]) => (ca === '') - (cb === '') || b.itens.length - a.itens.length || Series.porNome(a, b))
        .map(([, bloco]) => el('section', { class: 'secao-serie', 'aria-label': `${bloco.nome}, ${Util.plural(bloco.itens.length, 'Funko', 'Funkos')}` },
          el('div', { class: 'secao-cabecalho' },
            el('h2', { text: bloco.nome }),
            bloco.grupo ? el('span', { class: 'tag-grupo', vars: Util.varsGrupo(bloco.grupo), text: bloco.grupo }) : null,
            el('span', { class: 'secao-qtd', text: Util.plural(bloco.itens.length, 'Funko', 'Funkos') })),
          el('div', { class: 'grade', role: 'list' }, bloco.itens.map((i) => Render.card(i, tipo)))));
    },

    estadoVazio(tipo) {
      const filtro = Estado.filtros[tipo];
      if (Estado.listas[tipo].length && Estado.temFiltro(tipo)) {
        let texto;
        if (filtro.grupo || filtro.serie) texto = 'Nenhum Funko combina com os filtros escolhidos. Tire um filtro ou limpe todos.';
        else if (filtro.busca && filtro.categoria) texto = `Nenhum ${filtro.categoria} combina com “${filtro.busca.trim()}”.`;
        else if (filtro.busca) texto = `Nenhum Funko combina com “${filtro.busca.trim()}”. Confira a grafia ou busque pelo número.`;
        else texto = `Você ainda não tem nenhum ${filtro.categoria} aqui.`;
        return [
          Util.icone('lupa'),
          el('h2', { text: 'Nada encontrado' }),
          el('p', { text: texto }),
          el('button', {
            type: 'button', class: 'btn btn-secundario',
            on: { click: () => { Estado.limparFiltros(tipo); Render.lista(tipo); } },
          }, 'Limpar filtros'),
        ];
      }
      const colecao = tipo === 'colecao';
      return [
        Util.icone(colecao ? 'estante' : 'estrela'),
        el('h2', { text: colecao ? 'Sua estante está vazia' : 'Sua wishlist está vazia' }),
        el('p', { text: colecao ? 'Cadastre o primeiro Funko com foto, número e quanto você pagou.' : 'Anote os Funkos que você quer encontrar. Quando comprar um, mova para a coleção.' }),
        el('button', {
          type: 'button', class: 'btn btn-primario',
          on: { click: () => Modais.formulario(tipo) },
        }, colecao ? 'Adicionar Funko' : 'Adicionar à wishlist'),
      ];
    },

    silhueta(item) {
      const ns = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(ns, 'svg');
      svg.setAttribute('viewBox', '0 0 100 125');
      svg.setAttribute('class', 'silhueta');
      svg.setAttribute('aria-hidden', 'true');
      const forma = (tag, attrs) => {
        const n = document.createElementNS(ns, tag);
        for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
        svg.append(n);
        return n;
      };
      forma('rect', { x: 20, y: 22, width: 60, height: 50, rx: 15, fill: 'rgba(255,255,255,.07)' });
      forma('rect', { x: 33, y: 70, width: 34, height: 34, rx: 9, fill: 'rgba(255,255,255,.05)' });
      const letra = forma('text', {
        x: 50, y: 58, 'text-anchor': 'middle',
        'font-family': 'ui-rounded, -apple-system, system-ui, sans-serif',
        'font-weight': 800, 'font-size': 34, fill: 'var(--cat)',
      });
      letra.textContent = Array.from(item.nome.trim())[0].toUpperCase();
      return svg;
    },

    estrelas(nota) {
      return el('div', { class: 'estrelas', role: 'img', 'aria-label': `Desejo ${nota} de 5: ${DESEJO_TEXTOS[nota]}` },
        el('span', { class: 'cheias', text: '★'.repeat(nota) }),
        el('span', { class: 'vazias', text: '★'.repeat(5 - nota) }));
    },

    card(item, tipo) {
      const janela = el('div', { class: 'pop-janela' },
        item.foto ? el('img', { src: item.foto, alt: '', loading: 'lazy', decoding: 'async', draggable: 'false' }) : Render.silhueta(item),
        item.numero ? el('span', { class: 'pop-numero', 'aria-hidden': 'true' }, item.numero) : null,
      );

      const info = el('div', { class: 'pop-info' },
        el('h3', { class: 'pop-nome', text: item.nome }),
        item.serie ? el('p', { class: 'pop-serie', text: (Series.doRegistro(item.serie) || { nome: item.serie }).nome }) : null,
        el('span', { class: 'tag', text: item.categoria }),
        tipo === 'wishlist' && item.desejo ? Render.estrelas(item.desejo) : null,
        tipo === 'colecao' ? el('dl', { class: 'pop-valores' },
          el('dt', { text: 'Pago' }), el('dd', { text: Util.formatarMoeda(item.valorPago) }),
          el('dt', { text: 'Estimado' }), el('dd', { text: Util.formatarMoeda(item.valorEstimado) }),
        ) : null,
      );

      const rotulo = [item.numero ? `Número ${item.numero}` : '', item.nome].filter(Boolean).join(', ');
      return el('article', {
        class: 'pop', role: 'listitem', dataset: { id: item.id }, vars: Util.varsCategoria(item.categoria),
      },
        el('button', { type: 'button', class: 'pop-corpo', 'aria-label': `Editar ${rotulo}` }, janela, info),
        el('button', { type: 'button', class: 'pop-mais', 'aria-label': `Mais ações para ${item.nome}` },
          el('span', null, Util.icone('reticencias'))),
      );
    },

    dashboard() {
      const { colecao, wishlist } = Estado.listas;
      const somaPago = colecao.reduce((s, i) => s + (i.valorPago || 0), 0);
      const somaEstimado = colecao.reduce((s, i) => s + (i.valorEstimado || 0), 0);
      const diferenca = Math.round((somaEstimado - somaPago) * 100) / 100;
      const positiva = diferenca >= 0;

      const contagens = el('div', { class: 'contagens' },
        el('div', { class: 'contagem' },
          el('span', { class: 'contagem-num', text: String(colecao.length) }),
          el('span', { class: 'contagem-rotulo', text: colecao.length === 1 ? 'Funko na coleção' : 'Funkos na coleção' })),
        el('div', { class: 'contagem' },
          el('span', { class: 'contagem-num', text: String(wishlist.length) }),
          el('span', { class: 'contagem-rotulo', text: wishlist.length === 1 ? 'Funko na wishlist' : 'Funkos na wishlist' })),
      );

      const extrato = el('section', { class: 'extrato', 'aria-labelledby': 'titulo-extrato' },
        el('h2', { id: 'titulo-extrato', text: 'Valor da estante' }),
        el('dl', null,
          el('dt', { text: 'Você pagou' }), el('dd', { text: Util.moeda.format(somaPago) }),
          el('dt', { text: 'Vale hoje (estimado)' }), el('dd', { text: Util.moeda.format(somaEstimado) }),
          el('div', { class: 'diferenca-linha' },
            el('dt', { text: positiva ? 'Valorização' : 'Desvalorização' }),
            el('dd', {
              class: `diferenca ${positiva ? 'positivo' : 'negativo'}`,
              'aria-label': `${positiva ? 'Ganho' : 'Perda'} de ${Util.moeda.format(Math.abs(diferenca))}`,
            }, `${positiva ? '▲' : '▼'} ${Util.moedaComSinal.format(diferenca)}`)),
        ),
      );

      const porCategoria = new Map();
      for (const i of colecao) porCategoria.set(i.categoria, (porCategoria.get(i.categoria) || 0) + 1);
      const ordemCategorias = new Map(CATEGORIAS.map((c, idx) => [c.nome, idx]));
      const categorias = Render.blocoBarras({
        id: 'titulo-categorias',
        titulo: 'Por categoria',
        total: colecao.length,
        linhas: Array.from(porCategoria.entries())
          .sort((a, b) => b[1] - a[1] || ordemCategorias.get(a[0]) - ordemCategorias.get(b[0]))
          .map(([nome, qtd]) => ({ nome, qtd, vars: Util.varsCategoria(nome) })),
        vazio: 'Adicione Funkos à coleção para ver quantos você tem de cada categoria.',
      });

      const comSerie = colecao.filter((i) => Util.chaveSerie(i.serie));
      const semSerie = colecao.length - comSerie.length;
      const porGrupo = new Map();
      const porSerie = new Map();
      for (const i of comSerie) {
        const grupo = Series.grupoDe(i.serie);
        porGrupo.set(grupo, (porGrupo.get(grupo) || 0) + 1);
        const chave = Util.chaveSerie(i.serie);
        if (!porSerie.has(chave)) {
          const registrada = Series.doRegistro(i.serie);
          porSerie.set(chave, { nome: registrada ? registrada.nome : Util.limparSerie(i.serie), grupo, qtd: 0 });
        }
        porSerie.get(chave).qtd += 1;
      }
      const ordemGrupos = new Map(GRUPOS.map((g, idx) => [g.nome, idx]));
      const grupos = Render.blocoBarras({
        id: 'titulo-grupos',
        titulo: 'Por grupo',
        total: colecao.length,
        linhas: Array.from(porGrupo.entries())
          .sort((a, b) => b[1] - a[1] || ordemGrupos.get(a[0]) - ordemGrupos.get(b[0]))
          .map(([nome, qtd]) => ({ nome, qtd, vars: { '--cat': MAPA_GRUPOS.get(nome).cor } })),
        vazio: 'Escolha a série dos seus Funkos para ver a coleção dividida por grupo: anime, filmes, games e outros.',
        rodape: semSerie && comSerie.length ? el('p', { class: 'bloco-nota', text: `${Util.plural(semSerie, 'Funko está', 'Funkos estão')} sem série.` }) : null,
      });

      const linhasSerie = Array.from(porSerie.values()).sort((a, b) => b.qtd - a.qtd || Series.porNome(a, b));
      const LIMITE = 8;
      const visiveisSerie = Estado.dashTodasSeries ? linhasSerie : linhasSerie.slice(0, LIMITE);
      const nRegistro = Estado.listas.series.length;
      const series = Render.blocoBarras({
        id: 'titulo-series',
        titulo: 'Por série',
        total: colecao.length,
        linhas: visiveisSerie.map((x) => ({ nome: x.nome, qtd: x.qtd, vars: { '--cat': MAPA_GRUPOS.get(x.grupo).cor } })),
        vazio: 'Nenhum Funko da coleção tem série ainda. Edite um Funko e escolha a série dele.',
        rodape: el('div', { class: 'bloco-rodape' },
          linhasSerie.length > LIMITE ? el('button', {
            type: 'button', class: 'btn btn-secundario btn-largo', 'aria-expanded': String(Estado.dashTodasSeries),
            on: { click: () => { Estado.dashTodasSeries = !Estado.dashTodasSeries; Render.dashboard(); } },
          }, Estado.dashTodasSeries ? 'Mostrar só as principais' : `Mostrar todas as ${linhasSerie.length} séries`) : null,
          el('button', {
            type: 'button', class: 'btn btn-secundario btn-largo',
            on: { click: () => Modais.gerenciarSeries() },
          }, nRegistro ? `Gerenciar séries (${nRegistro})` : 'Gerenciar séries')),
      });

      const ultimo = Storage.lerTexto(CHAVE_ULTIMO_BACKUP);
      const dataUltimo = ultimo && !Number.isNaN(new Date(ultimo).getTime())
        ? new Date(ultimo).toLocaleDateString('pt-BR', { day: 'numeric', month: 'long', year: 'numeric' })
        : null;

      const backup = el('section', { class: 'bloco', 'aria-labelledby': 'titulo-backup' },
        el('h2', { id: 'titulo-backup', text: 'Backup' }),
        el('p', { class: 'bloco-texto', text: dataUltimo
          ? `Último backup em ${dataUltimo}. O Safari pode apagar os dados de apps sem uso, então exporte com frequência.`
          : 'Você ainda não fez backup. O Safari pode apagar os dados de apps sem uso: exporte um arquivo e guarde no iCloud Drive.' }),
        el('div', { class: 'backup-botoes' },
          el('button', { type: 'button', class: 'btn btn-primario btn-largo', on: { click: Backup.exportar } }, Util.icone('exportar'), 'Exportar backup (JSON)'),
          el('button', { type: 'button', class: 'btn btn-secundario btn-largo', on: { click: Backup.escolherArquivo } }, Util.icone('importar'), 'Importar backup')),
      );

      dom.dashboard.replaceChildren(contagens, extrato, categorias, grupos, series, backup);
    },

    blocoBarras({ id, titulo, total, linhas, vazio, rodape = null }) {
      const itens = linhas.map(({ nome, qtd, vars }) => {
        const frac = total ? qtd / total : 0;
        return el('li', { class: 'categoria-linha', vars },
          el('span', { class: 'categoria-nome', text: nome }),
          el('span', { class: 'categoria-num' }, el('strong', { text: String(qtd) }), ` (${Util.percentual.format(frac)})`),
          el('div', { class: 'barra', 'aria-hidden': 'true' }, el('span', { vars: { width: `${(frac * 100).toFixed(1)}%` } })));
      });
      return el('section', { class: 'bloco', 'aria-labelledby': id },
        el('h2', { id, text: titulo }),
        itens.length ? el('ul', { class: 'categorias-lista' }, itens) : el('p', { class: 'bloco-texto', text: vazio }),
        rodape);
    },
  };

  /* =======================================================
     MODAIS: toast, folhas, formulários e confirmações
     ======================================================= */
  const Toast = {
    timer: null,
    mostrar(mensagem, tipo) {
      const area = document.getElementById('toasts');
      const erro = tipo === 'erro';
      const toast = el('div', {
        class: `toast ${erro ? 'toast-erro' : 'toast-sucesso'}`,
        role: erro ? 'alert' : 'status',
      }, Util.icone(erro ? 'alerta' : 'ok'), el('span', { text: mensagem }));
      area.replaceChildren(toast);
      requestAnimationFrame(() => requestAnimationFrame(() => toast.classList.add('visivel')));
      clearTimeout(Toast.timer);
      Toast.timer = setTimeout(() => {
        toast.classList.remove('visivel');
        setTimeout(() => toast.remove(), 300);
      }, erro ? 4200 : 2400);
    },
    ok(m) { Toast.mostrar(m, 'sucesso'); },
    erro(m) { Toast.mostrar(m, 'erro'); },
  };

  const Folha = {
    atual: null,

    abrir({ rotulo, conteudo, acoes = false, aoFechar = null }) {
      if (Folha.atual) Folha.atual.fechar(true);
      const focoAnterior = document.activeElement;
      const painel = el('div', {
        class: `folha${acoes ? ' folha-acoes' : ''}`,
        role: 'dialog', 'aria-modal': 'true', 'aria-label': rotulo,
      }, acoes ? null : el('div', { class: 'folha-alca', 'aria-hidden': 'true' }), conteudo);
      const fundo = el('div', { class: 'camada-fundo' });
      const camada = el('div', { class: 'camada' }, fundo, painel);

      const controle = {
        painel,
        fechado: false,
        fechar(imediato) {
          if (controle.fechado) return;
          controle.fechado = true;
          document.removeEventListener('keydown', teclado, true);
          if (Folha.atual === controle) Folha.atual = null;
          if (!Folha.atual) dom.app.inert = false;
          const remover = () => camada.remove();
          if (imediato) remover();
          else {
            camada.classList.remove('aberta');
            setTimeout(remover, 360);
          }
          if (!Folha.atual && focoAnterior && document.contains(focoAnterior)) focoAnterior.focus({ preventScroll: true });
          if (aoFechar) aoFechar();
        },
      };

      const teclado = (e) => {
        if (e.key === 'Escape') {
          if (e.target instanceof Element && e.target.getAttribute('aria-expanded') === 'true') return;
          e.preventDefault();
          controle.fechar();
          return;
        }
        if (e.key !== 'Tab') return;
        const focaveis = Array.from(painel.querySelectorAll('button, input, select, [tabindex]:not([tabindex="-1"])'))
          .filter((n) => !n.disabled && n.offsetParent !== null);
        if (!focaveis.length) return;
        const primeiro = focaveis[0];
        const ultimo = focaveis[focaveis.length - 1];
        if (e.shiftKey && document.activeElement === primeiro) { e.preventDefault(); ultimo.focus(); }
        else if (!e.shiftKey && document.activeElement === ultimo) { e.preventDefault(); primeiro.focus(); }
      };

      fundo.addEventListener('click', () => controle.fechar());
      document.addEventListener('keydown', teclado, true);
      document.body.append(camada);
      dom.app.inert = true;
      Folha.atual = controle;
      requestAnimationFrame(() => requestAnimationFrame(() => camada.classList.add('aberta')));
      const alvo = painel.querySelector('[data-foco-inicial]') || painel.querySelector('button, input, select');
      if (alvo) alvo.focus({ preventScroll: true });
      return controle;
    },
  };

  const Modais = {
    campoTexto({ id, rotulo, valor, obrigatorio, placeholder, maxlength, inputmode, autocapitalize }) {
      const input = el('input', {
        id, class: 'entrada', type: 'text', value: valor || '', placeholder, maxlength,
        inputmode, autocapitalize, autocomplete: 'off', 'aria-required': obrigatorio ? 'true' : null,
      });
      const erro = el('p', { class: 'erro-campo', id: `${id}-erro`, hidden: true });
      const campo = el('div', { class: 'campo' },
        el('label', { for: id }, rotulo, obrigatorio ? el('span', { class: 'obrigatorio', 'aria-hidden': 'true' }, ' *') : null),
        input, erro);
      return { campo, input, erro };
    },

    campoValor({ id, rotulo, valor }) {
      const input = el('input', {
        id, class: 'entrada', type: 'text', inputmode: 'decimal', value: Util.valorParaCampo(valor),
        placeholder: '0,00', autocomplete: 'off', enterkeyhint: 'next',
      });
      const erro = el('p', { class: 'erro-campo', id: `${id}-erro`, hidden: true });
      const campo = el('div', { class: 'campo' },
        el('label', { for: id, text: rotulo }),
        el('div', { class: 'com-prefixo' }, el('span', { 'aria-hidden': 'true', text: 'R$' }), input),
        erro);
      return { campo, input, erro };
    },

    campoDesejo(inicial) {
      let atual = inicial;
      const texto = el('span', { class: 'nota-texto', 'aria-hidden': 'true' });
      const estrelas = [1, 2, 3, 4, 5].map((n) => {
        const radio = el('input', {
          type: 'radio', name: 'desejo', value: String(n),
          'aria-label': `${n} ${n === 1 ? 'estrela' : 'estrelas'}: ${DESEJO_TEXTOS[n]}`,
        });
        radio.checked = n === inicial;
        radio.addEventListener('change', () => { atual = n; pintar(); });
        return el('label', { class: 'nota-estrela' }, radio, Util.icone('estrelaCheia'));
      });
      const pintar = () => {
        estrelas.forEach((rotulo, i) => rotulo.classList.toggle('cheia', atual !== null && i < atual));
        texto.textContent = atual ? DESEJO_TEXTOS[atual] : 'Sem nota';
      };
      pintar();
      const campo = el('fieldset', { class: 'nota' },
        el('legend', { text: 'Nota de desejo' }),
        el('div', { class: 'nota-linha' }, el('div', { class: 'nota-estrelas' }, estrelas), texto));
      return { campo, valor: () => atual };
    },

    campoFoto(inicial) {
      const SEM_IMAGEM = 'Não há imagem copiada. Copie uma foto e tente de novo.';
      let foto = inicial;
      let ocupado = false;

      const preview = el('div', { class: 'foto-preview' });
      const seletor = el('input', { type: 'file', accept: 'image/*', hidden: true, 'aria-hidden': 'true', tabindex: '-1' });
      const btnColar = el('button', { type: 'button', class: 'btn btn-secundario btn-foto' });
      const btnFototeca = el('button', { type: 'button', class: 'btn btn-secundario btn-foto' });
      const btnRemover = el('button', { type: 'button', class: 'btn btn-remover-foto', text: 'Remover foto' });
      const dica = el('p', { class: 'foto-dica', 'aria-live': 'polite', hidden: true });
      const area = el('div', {
        class: 'area-colar', contenteditable: 'true', role: 'textbox', inputmode: 'none',
        'aria-label': 'Área para colar a foto', 'data-placeholder': 'Toque e segure aqui e escolha Colar', hidden: true,
      });

      const desenhar = () => {
        preview.replaceChildren(foto ? el('img', { src: foto, alt: 'Foto do Funko' }) : Util.icone('camera'));
        btnColar.replaceChildren(Util.icone('colar'), 'Colar foto');
        btnFototeca.replaceChildren(Util.icone('camera'), 'Escolher da fototeca');
        btnColar.disabled = false;
        btnFototeca.disabled = false;
        btnRemover.hidden = !foto;
      };

      const mostrarArea = (mensagem) => {
        dica.textContent = mensagem;
        dica.hidden = false;
        area.hidden = false;
        area.focus({ preventScroll: true });
        area.scrollIntoView({ block: 'nearest' });
      };

      const processar = async (imagem) => {
        if (ocupado) return;
        if (imagem.type && !imagem.type.startsWith('image/')) {
          Toast.erro('Esse arquivo não é uma imagem. Escolha uma foto.');
          return;
        }
        ocupado = true;
        btnColar.disabled = true;
        btnFototeca.disabled = true;
        btnFototeca.replaceChildren('Preparando foto…');
        try {
          foto = await Util.fotoParaJpeg(imagem);
          area.hidden = true;
          dica.hidden = true;
        } catch (e) {
          Toast.erro('Não foi possível abrir essa imagem. Tente outra foto em JPEG ou PNG.');
        }
        ocupado = false;
        desenhar();
      };

      btnFototeca.addEventListener('click', () => seletor.click());
      btnRemover.addEventListener('click', () => { foto = null; desenhar(); btnFototeca.focus(); });
      seletor.addEventListener('change', () => {
        const arquivo = seletor.files && seletor.files[0];
        seletor.value = '';
        if (arquivo) processar(arquivo);
      });

      btnColar.addEventListener('click', async () => {
        if (ocupado) return;
        if (!navigator.clipboard || typeof navigator.clipboard.read !== 'function') {
          mostrarArea('Este navegador não deixa o app ler o que você copiou. Toque e segure na área abaixo e escolha Colar.');
          return;
        }
        let itens;
        try {
          itens = await navigator.clipboard.read();
        } catch (e) {
          mostrarArea(e && e.name === 'NotAllowedError'
            ? 'O navegador não deu acesso ao que você copiou. Toque e segure na área abaixo e escolha Colar, ou use ⌘V.'
            : 'Não deu para ler o que você copiou. Toque e segure na área abaixo e escolha Colar.');
          return;
        }
        for (const item of itens) {
          const tipo = item.types.find((t) => t.startsWith('image/'));
          if (tipo) {
            processar(await item.getType(tipo));
            return;
          }
        }
        Toast.erro(SEM_IMAGEM);
        mostrarArea('Se a foto estiver copiada em outro app, toque e segure na área abaixo e escolha Colar.');
      });

      // Ouve ⌘V / Ctrl+V e o "Colar" do iPhone enquanto o formulário estiver aberto.
      const aoColar = (e) => {
        const naArea = e.target instanceof Element && e.target.closest('.area-colar');
        const imagem = Util.imagemDoColar(e);
        if (!imagem) {
          if (naArea) { e.preventDefault(); Toast.erro(SEM_IMAGEM); }
          return;
        }
        e.preventDefault();
        processar(imagem);
      };
      area.addEventListener('input', () => { area.textContent = ''; });
      desenhar();

      const campo = el('div', { class: 'campo' },
        el('span', { class: 'campo-rotulo', text: 'Foto' }),
        el('div', { class: 'foto-area' }, preview, el('div', { class: 'foto-botoes' }, btnColar, btnFototeca, btnRemover)),
        dica, area, seletor);

      return {
        campo,
        seletor,
        valor: () => foto,
        ligar: () => document.addEventListener('paste', aoColar),
        desligar: () => document.removeEventListener('paste', aoColar),
      };
    },

    campoSerie(inicial) {
      const id = 'f-serie';
      const input = el('input', {
        id, class: 'entrada', type: 'text', value: inicial || '', placeholder: 'Ex.: Star Wars', maxlength: SERIE_MAX,
        autocapitalize: 'words', autocomplete: 'off', autocorrect: 'off', spellcheck: 'false', enterkeyhint: 'next',
        role: 'combobox', 'aria-autocomplete': 'list', 'aria-expanded': 'false', 'aria-controls': `${id}-lista`,
      });
      const lista = el('ul', { id: `${id}-lista`, class: 'combo-lista', role: 'listbox', 'aria-label': 'Sugestões de série', hidden: true });
      const grupo = el('select', { id: `${id}-grupo`, class: 'entrada' }, GRUPOS.map((g) => el('option', { value: g.nome, text: g.nome })));
      grupo.value = GRUPO_PADRAO;
      const textoNovo = el('p');
      const novo = el('div', { class: 'combo-novo', hidden: true },
        textoNovo, el('label', { for: `${id}-grupo`, text: 'Grupo da nova série' }), grupo);
      const erro = el('p', { class: 'erro-campo', id: `${id}-erro`, hidden: true });
      const reduzirMovimento = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      let opcoes = [];
      let ativa = -1;
      let fecharTimer = null;

      const rolar = () => {
        input.scrollIntoView({ block: 'start', behavior: reduzirMovimento ? 'auto' : 'smooth' });
      };
      const fechar = () => {
        lista.hidden = true;
        input.setAttribute('aria-expanded', 'false');
        input.removeAttribute('aria-activedescendant');
        ativa = -1;
        atualizarNovo();
      };
      const marcarAtiva = (indice) => {
        ativa = indice;
        lista.querySelectorAll('[role="option"]').forEach((op, i) => op.setAttribute('aria-selected', String(i === ativa)));
        const atual = lista.querySelector(`#${id}-op-${ativa}`);
        if (atual) {
          input.setAttribute('aria-activedescendant', atual.id);
          atual.scrollIntoView({ block: 'nearest' });
        } else {
          input.removeAttribute('aria-activedescendant');
        }
      };
      const atualizarNovo = () => {
        const nome = Util.limparSerie(input.value);
        const precisa = Boolean(nome) && !Series.doRegistro(nome) && !Series.doCatalogo(nome);
        novo.hidden = !precisa || !lista.hidden;
        if (precisa) textoNovo.textContent = `“${nome}” vai entrar como nova série.`;
      };
      const escolher = (indice) => {
        const op = opcoes[indice];
        if (!op) return;
        if (!op.nova) input.value = op.nome;
        fechar();
        atualizarNovo();
        if (op.nova) grupo.focus();
      };
      const montar = () => {
        const termo = Util.chaveSerie(input.value);
        const uso = Series.uso();
        const registradas = new Set(Estado.listas.series.map((x) => Util.chaveSerie(x.nome)));
        const minhas = Estado.listas.series
          .filter((x) => !termo || Util.chaveSerie(x.nome).includes(termo))
          .sort((a, b) => (uso.get(Util.chaveSerie(b.nome)) || 0) - (uso.get(Util.chaveSerie(a.nome)) || 0) || Series.porNome(a, b))
          .slice(0, 8);
        const sugestoes = Series.catalogo()
          .filter((x) => !registradas.has(x.chave) && (!termo || x.chave.includes(termo)))
          .slice(0, 8);
        const exata = Boolean(termo) && (registradas.has(termo) || Series.catalogo().some((x) => x.chave === termo));

        opcoes = [];
        const filhos = [];
        const opcao = (dados, conteudo, classe) => {
          const indice = opcoes.length;
          opcoes.push(dados);
          return el('li', {
            id: `${id}-op-${indice}`, class: `combo-opcao${classe ? ` ${classe}` : ''}`, role: 'option', 'aria-selected': 'false',
            on: {
              pointerdown: (e) => e.preventDefault(),
              click: () => escolher(indice),
            },
          }, conteudo);
        };
        const linhaSerie = (x) => opcao(x, [
          el('span', { class: 'combo-nome', text: x.nome }),
          el('span', { class: 'tag-grupo', vars: Util.varsGrupo(x.grupo), text: x.grupo }),
        ]);
        if (minhas.length) {
          filhos.push(el('li', { class: 'combo-titulo', role: 'presentation', text: 'Suas séries' }));
          minhas.forEach((x) => filhos.push(linhaSerie(x)));
        }
        if (sugestoes.length) {
          filhos.push(el('li', { class: 'combo-titulo', role: 'presentation', text: 'Sugestões' }));
          sugestoes.forEach((x) => filhos.push(linhaSerie(x)));
        }
        if (termo && !exata) {
          const nome = Util.limparSerie(input.value);
          filhos.push(opcao({ nova: true, nome }, [Util.icone('mais'), el('span', { text: `Adicionar “${nome}” como nova série` })], 'combo-opcao-nova'));
        }
        lista.replaceChildren(...filhos);
        ativa = -1;
        input.removeAttribute('aria-activedescendant');
        if (opcoes.length) {
          lista.hidden = false;
          input.setAttribute('aria-expanded', 'true');
        } else {
          fechar();
        }
        atualizarNovo();
      };

      input.addEventListener('input', montar);
      input.addEventListener('focus', () => {
        clearTimeout(fecharTimer);
        montar();
        setTimeout(rolar, 300);
      });
      input.addEventListener('blur', () => { fecharTimer = setTimeout(fechar, 150); });
      input.addEventListener('keydown', (e) => {
        const aberta = !lista.hidden;
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (!aberta) montar();
          if (opcoes.length) marcarAtiva((ativa + 1) % opcoes.length);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (!aberta) montar();
          if (opcoes.length) marcarAtiva(ativa <= 0 ? opcoes.length - 1 : ativa - 1);
        } else if (e.key === 'Enter' && aberta && ativa >= 0) {
          e.preventDefault();
          escolher(ativa);
        } else if (e.key === 'Escape' && aberta) {
          e.preventDefault();
          fechar();
        }
      });
      if (window.visualViewport) {
        const aoRedimensionar = () => { if (document.activeElement === input) rolar(); };
        window.visualViewport.addEventListener('resize', aoRedimensionar);
        input.addEventListener('remover-ouvintes', () => window.visualViewport.removeEventListener('resize', aoRedimensionar));
      }
      atualizarNovo();

      const campo = el('div', { class: 'campo combo' },
        el('label', { for: id, text: 'Série' }), input, lista, novo, erro);
      return {
        campo,
        input,
        erro,
        valor: () => Util.limparSerie(input.value),
        grupoNovo: () => grupo.value,
        desligar: () => input.dispatchEvent(new Event('remover-ouvintes')),
      };
    },

    marcarErro(ref, mensagem) {
      if (mensagem) {
        ref.erro.textContent = mensagem;
        ref.erro.hidden = false;
        ref.input.setAttribute('aria-invalid', 'true');
        ref.input.setAttribute('aria-describedby', ref.erro.id);
      } else {
        ref.erro.hidden = true;
        ref.input.removeAttribute('aria-invalid');
        ref.input.removeAttribute('aria-describedby');
      }
      return !mensagem;
    },

    validarValor(ref) {
      const v = Util.lerValor(ref.input.value);
      Modais.marcarErro(ref, Number.isNaN(v) ? 'Use só números, como 89,90.' : null);
      return v;
    },

    formulario(tipo, item) {
      const editando = Boolean(item);
      const colecao = tipo === 'colecao';

      const numero = Modais.campoTexto({ id: 'f-numero', rotulo: 'Número', valor: item && item.numero, placeholder: '001', maxlength: 12, inputmode: 'numeric' });
      const nome = Modais.campoTexto({ id: 'f-nome', rotulo: 'Nome', valor: item && item.nome, obrigatorio: true, placeholder: 'Ex.: Darth Vader', maxlength: 120, autocapitalize: 'words' });
      const serie = Modais.campoSerie(item ? item.serie : '');

      const select = el('select', { id: 'f-categoria', class: 'entrada', 'aria-required': 'true' },
        el('option', { value: '', text: 'Escolha' }),
        CATEGORIAS.map((c) => el('option', { value: c.nome, text: c.nome })));
      select.value = item ? item.categoria : '';
      const categoria = {
        input: select,
        erro: el('p', { class: 'erro-campo', id: 'f-categoria-erro', hidden: true }),
      };
      const campoCategoria = el('div', { class: 'campo' },
        el('label', { for: 'f-categoria' }, 'Categoria', el('span', { class: 'obrigatorio', 'aria-hidden': 'true' }, ' *')),
        select, categoria.erro);

      const pago = colecao ? Modais.campoValor({ id: 'f-pago', rotulo: 'Valor pago', valor: item && item.valorPago }) : null;
      const estimado = colecao ? Modais.campoValor({ id: 'f-estimado', rotulo: 'Valor estimado', valor: item && item.valorEstimado }) : null;

      const campoFoto = Modais.campoFoto(item ? item.foto : null);

      const nota = colecao ? null : Modais.campoDesejo(item ? (item.desejo || null) : DESEJO_PADRAO);

      const btnSalvar = el('button', { type: 'submit', class: 'btn btn-primario', text: editando ? 'Salvar alterações' : (colecao ? 'Salvar Funko' : 'Salvar na wishlist') });
      let folha;
      const form = el('form', { class: 'form', novalidate: true },
        campoFoto.campo,
        el('div', { class: 'linha-2' }, numero.campo, campoCategoria),
        nome.campo,
        serie.campo,
        colecao ? el('div', { class: 'linha-2' }, pago.campo, estimado.campo) : nota.campo,
        el('div', { class: 'form-botoes' },
          el('button', { type: 'button', class: 'btn btn-secundario', text: 'Cancelar', on: { click: () => folha.fechar() } }),
          btnSalvar));

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const okNome = Modais.marcarErro(nome, nome.input.value.trim() ? null : 'Digite o nome do Funko.');
        const okCategoria = Modais.marcarErro(categoria, MAPA_CATEGORIAS.has(select.value) ? null : 'Escolha uma categoria.');
        const valorPago = colecao ? Modais.validarValor(pago) : null;
        const valorEstimado = colecao ? Modais.validarValor(estimado) : null;
        const okValores = !Number.isNaN(valorPago) && !Number.isNaN(valorEstimado);
        if (!okNome || !okCategoria || !okValores) {
          const primeiroErro = form.querySelector('[aria-invalid="true"]');
          if (primeiroErro) primeiroErro.focus();
          return;
        }
        const dados = {
          numero: numero.input.value.trim(),
          nome: nome.input.value.trim(),
          serie: serie.valor(),
          categoria: select.value,
          foto: campoFoto.valor(),
          valorPago,
          valorEstimado,
          desejo: colecao ? null : nota.valor(),
        };
        const ok = editando
          ? Estado.atualizar(tipo, item.id, dados, serie.grupoNovo())
          : Estado.adicionar(tipo, dados, serie.grupoNovo());
        if (!ok) return;
        folha.fechar();
        Toast.ok(editando ? 'Alterações salvas' : (colecao ? 'Funko salvo na coleção' : 'Funko salvo na wishlist'));
      });

      for (const ref of [nome, categoria, pago, estimado].filter(Boolean)) {
        ref.input.addEventListener(ref.input.tagName === 'SELECT' ? 'change' : 'input', () => Modais.marcarErro(ref, null));
      }

      const titulo = editando ? 'Editar Funko' : (colecao ? 'Novo Funko na coleção' : 'Novo Funko na wishlist');
      if (!editando) nome.input.setAttribute('data-foco-inicial', '');
      campoFoto.ligar();
      folha = Folha.abrir({
        rotulo: titulo,
        conteudo: [el('h2', { text: titulo }), form],
        aoFechar: () => { campoFoto.desligar(); serie.desligar(); },
      });
    },

    acoes(tipo, id) {
      const item = Estado.buscar(tipo, id);
      if (!item) return;
      const colecao = tipo === 'colecao';
      let folha;
      const acao = (icone, texto, fn, perigo) => el('button', {
        type: 'button', class: `acao${perigo ? ' acao-perigo' : ''}`,
        on: { click: () => { folha.fechar(true); fn(); } },
      }, Util.icone(icone), texto);

      const conteudo = [
        el('div', { class: 'grupo-acoes' },
          el('div', { class: 'grupo-acoes-titulo', text: item.numero ? `#${item.numero} ${item.nome}` : item.nome }),
          acao('editar', 'Editar', () => Modais.formulario(tipo, item)),
          colecao
            ? acao('mover', 'Mover para Wishlist', () => {
              if (Estado.mover(id, 'colecao', 'wishlist', {})) Toast.ok('Movido para a wishlist');
            })
            : acao('mover', 'Mover para Coleção', () => Modais.moverParaColecao(id)),
          acao('lixeira', 'Excluir', () => Modais.confirmarExclusao(tipo, item), true)),
        el('button', { type: 'button', class: 'acao acao-cancelar', text: 'Cancelar', on: { click: () => folha.fechar() } }),
      ];
      folha = Folha.abrir({ rotulo: `Ações para ${item.nome}`, conteudo, acoes: true });
    },

    gerenciarSeries() {
      const uso = Series.uso();
      const series = Estado.listas.series;
      const grupos = GRUPOS
        .map((g) => ({ grupo: g.nome, lista: series.filter((x) => x.grupo === g.nome).sort(Series.porNome) }))
        .filter((g) => g.lista.length);
      let folha;
      const linha = (x) => {
        const n = uso.get(Util.chaveSerie(x.nome)) || 0;
        const qtd = n ? Util.plural(n, 'Funko', 'Funkos') : 'Nenhum Funko';
        return el('button', {
          type: 'button', class: 'acao serie-linha', 'aria-label': `${x.nome}, ${qtd}. Abrir ações`,
          on: { click: () => Modais.acoesSerie(x.id) },
        }, el('span', { class: 'serie-nome', text: x.nome }), el('span', { class: 'serie-qtd', text: qtd }), Util.icone('reticencias'));
      };
      const conteudo = [
        el('h2', { text: 'Séries' }),
        el('p', {
          class: 'folha-texto',
          text: series.length
            ? `${Util.plural(series.length, 'série', 'séries')} em ${Util.plural(grupos.length, 'grupo', 'grupos')}. Toque numa série para renomear, mudar de grupo, mesclar ou excluir.`
            : 'Nenhuma série ainda. Quando você salvar um Funko com série, ela aparece aqui.',
        }),
        grupos.map((g) => el('section', { class: 'series-grupo', vars: Util.varsGrupo(g.grupo), 'aria-label': g.grupo },
          el('h3', { text: g.grupo }),
          el('div', { class: 'grupo-acoes' }, g.lista.map(linha)))),
        el('button', { type: 'button', class: 'btn btn-secundario btn-largo series-fechar', text: 'Fechar', on: { click: () => folha.fechar() } }),
      ];
      folha = Folha.abrir({ rotulo: 'Gerenciar séries', conteudo });
    },

    acoesSerie(id) {
      const serie = Series.porId(id);
      if (!serie) return;
      let folha;
      const acao = (icone, texto, fn, perigo) => el('button', {
        type: 'button', class: `acao${perigo ? ' acao-perigo' : ''}`,
        on: { click: () => { folha.fechar(true); fn(); } },
      }, Util.icone(icone), texto);
      const conteudo = [
        el('div', { class: 'grupo-acoes' },
          el('div', { class: 'grupo-acoes-titulo', text: `${serie.nome}, em ${serie.grupo}` }),
          acao('editar', 'Renomear', () => Modais.renomearSerie(id)),
          acao('pasta', 'Mudar de grupo', () => Modais.grupoSerie(id)),
          acao('mesclar', 'Mesclar com outra série', () => Modais.mesclarSerie(id)),
          acao('lixeira', 'Excluir do registro', () => Modais.excluirSerie(id), true)),
        el('button', { type: 'button', class: 'acao acao-cancelar', text: 'Voltar', on: { click: () => Modais.gerenciarSeries() } }),
      ];
      folha = Folha.abrir({ rotulo: `Ações para ${serie.nome}`, conteudo, acoes: true });
    },

    folhaSerie({ titulo, texto, campo, botao, aoEnviar }) {
      const form = el('form', { class: 'form', novalidate: true },
        texto ? el('p', { class: 'folha-texto', text: texto }) : null,
        campo,
        el('div', { class: 'form-botoes' },
          el('button', { type: 'button', class: 'btn btn-secundario', text: 'Voltar', on: { click: () => Modais.gerenciarSeries() } }),
          el('button', { type: 'submit', class: 'btn btn-primario', text: botao })));
      form.addEventListener('submit', (e) => { e.preventDefault(); aoEnviar(); });
      Folha.abrir({ rotulo: titulo, conteudo: [el('h2', { text: titulo }), form] });
    },

    renomearSerie(id) {
      const serie = Series.porId(id);
      if (!serie) return;
      const n = Series.contar(serie.nome);
      const ref = Modais.campoTexto({ id: 's-nome', rotulo: 'Novo nome', valor: serie.nome, obrigatorio: true, maxlength: SERIE_MAX, autocapitalize: 'words' });
      ref.input.setAttribute('data-foco-inicial', '');
      ref.input.addEventListener('input', () => Modais.marcarErro(ref, null));
      Modais.folhaSerie({
        titulo: `Renomear ${serie.nome}`,
        texto: n ? `${Util.plural(n, 'Funko passa', 'Funkos passam')} a usar o novo nome, na coleção e na wishlist.` : 'Nenhum Funko usa essa série ainda.',
        campo: ref.campo,
        botao: 'Salvar nome',
        aoEnviar: () => {
          const novo = Util.limparSerie(ref.input.value);
          const outra = Series.doRegistro(novo);
          if (!novo) Modais.marcarErro(ref, 'Digite o nome da série.');
          else if (outra && outra.id !== id) Modais.marcarErro(ref, `Já existe a série “${outra.nome}”. Use Mesclar com outra série para juntar as duas.`);
          else if (novo === serie.nome) { Modais.gerenciarSeries(); return; }
          else if (Estado.renomearSerie(id, novo)) { Toast.ok('Série renomeada'); Modais.gerenciarSeries(); return; }
          else return;
          ref.input.focus();
        },
      });
    },

    grupoSerie(id) {
      const serie = Series.porId(id);
      if (!serie) return;
      const select = el('select', { id: 's-grupo', class: 'entrada', 'data-foco-inicial': true }, GRUPOS.map((g) => el('option', { value: g.nome, text: g.nome })));
      select.value = serie.grupo;
      Modais.folhaSerie({
        titulo: `Grupo de ${serie.nome}`,
        texto: 'O grupo organiza as séries por tipo de obra nos filtros e no Dashboard.',
        campo: el('div', { class: 'campo' }, el('label', { for: 's-grupo', text: 'Grupo' }), select),
        botao: 'Salvar grupo',
        aoEnviar: () => {
          if (select.value === serie.grupo) { Modais.gerenciarSeries(); return; }
          if (Estado.mudarGrupoSerie(id, select.value)) { Toast.ok('Grupo alterado'); Modais.gerenciarSeries(); }
        },
      });
    },

    mesclarSerie(id) {
      const serie = Series.porId(id);
      if (!serie) return;
      const outras = Estado.listas.series.filter((x) => x.id !== id);
      if (!outras.length) {
        Toast.erro('Não há outra série para mesclar. Salve um Funko com outra série primeiro.');
        Modais.gerenciarSeries();
        return;
      }
      const n = Series.contar(serie.nome);
      const select = el('select', { id: 's-destino', class: 'entrada', 'data-foco-inicial': true },
        GRUPOS.map((g) => {
          const doGrupo = outras.filter((x) => x.grupo === g.nome).sort(Series.porNome);
          return doGrupo.length ? el('optgroup', { label: g.nome }, doGrupo.map((x) => el('option', { value: x.id, text: x.nome }))) : null;
        }));
      Modais.folhaSerie({
        titulo: `Mesclar ${serie.nome}`,
        texto: `${n ? `${Util.plural(n, 'Funko de', 'Funkos de')} “${serie.nome}” ${n === 1 ? 'passa' : 'passam'} para a série escolhida` : 'Nenhum Funko usa essa série'}, e “${serie.nome}” sai do registro.`,
        campo: el('div', { class: 'campo' }, el('label', { for: 's-destino', text: 'Juntar com' }), select),
        botao: 'Continuar',
        aoEnviar: async () => {
          const destino = Series.porId(select.value);
          if (!destino) return;
          const sim = await Modais.confirmar({
            titulo: `Mesclar ${serie.nome} em ${destino.nome}?`,
            texto: `${n ? `${Util.plural(n, 'Funko passa', 'Funkos passam')} para “${destino.nome}”` : 'Nenhum Funko muda'} e “${serie.nome}” sai do registro. Não dá para desfazer.`,
            confirmar: 'Mesclar séries',
            perigo: true,
          });
          if (sim && Estado.mesclarSeries(id, destino.id)) Toast.ok('Séries mescladas');
          Modais.gerenciarSeries();
        },
      });
    },

    async excluirSerie(id) {
      const serie = Series.porId(id);
      if (!serie) return;
      const n = Series.contar(serie.nome);
      if (n) {
        let folha;
        folha = Folha.abrir({
          rotulo: 'Não dá para excluir ainda',
          conteudo: [
            el('h2', { text: 'Não dá para excluir ainda' }),
            el('p', { class: 'folha-texto', text: `“${serie.nome}” está em ${Util.plural(n, 'Funko', 'Funkos')}. Mescle com outra série: os Funkos passam para ela e “${serie.nome}” sai do registro.` }),
            el('div', { class: 'form-botoes' },
              el('button', { type: 'button', class: 'btn btn-secundario', text: 'Voltar', 'data-foco-inicial': true, on: { click: () => Modais.gerenciarSeries() } }),
              el('button', { type: 'button', class: 'btn btn-primario', text: 'Mesclar com outra série', on: { click: () => { folha.fechar(true); Modais.mesclarSerie(id); } } })),
          ],
        });
        return;
      }
      const sim = await Modais.confirmar({
        titulo: `Excluir ${serie.nome}?`,
        texto: 'Nenhum Funko usa essa série. Ela sai da sua lista de séries.',
        confirmar: 'Excluir série',
        perigo: true,
      });
      if (sim && Estado.excluirSerie(id)) Toast.ok('Série excluída');
      Modais.gerenciarSeries();
    },

    confirmar({ titulo, texto, confirmar, perigo }) {
      return new Promise((resolve) => {
        let resposta = false;
        let folha;
        const conteudo = [
          el('h2', { text: titulo }),
          el('p', { class: 'folha-texto', text: texto }),
          el('div', { class: 'form-botoes' },
            el('button', { type: 'button', class: 'btn btn-secundario', text: 'Cancelar', 'data-foco-inicial': true, on: { click: () => folha.fechar() } }),
            el('button', {
              type: 'button', class: `btn ${perigo ? 'btn-perigo' : 'btn-primario'}`, text: confirmar,
              on: { click: () => { resposta = true; folha.fechar(); } },
            })),
        ];
        folha = Folha.abrir({ rotulo: titulo, conteudo, aoFechar: () => resolve(resposta) });
      });
    },

    async confirmarExclusao(tipo, item) {
      const sim = await Modais.confirmar({
        titulo: `Excluir ${item.nome}?`,
        texto: `O Funko e a foto saem da ${tipo === 'colecao' ? 'coleção' : 'wishlist'}. Não dá para desfazer.`,
        confirmar: 'Excluir Funko',
        perigo: true,
      });
      if (sim && Estado.excluir(tipo, item.id)) Toast.ok('Funko excluído');
    },

    moverParaColecao(id) {
      const item = Estado.buscar('wishlist', id);
      if (!item) return;
      const pago = Modais.campoValor({ id: 'm-pago', rotulo: 'Valor pago', valor: null });
      const estimado = Modais.campoValor({ id: 'm-estimado', rotulo: 'Valor estimado', valor: null });
      pago.input.setAttribute('data-foco-inicial', '');
      for (const ref of [pago, estimado]) ref.input.addEventListener('input', () => Modais.marcarErro(ref, null));
      let folha;
      const form = el('form', { class: 'form', novalidate: true },
        el('p', { class: 'folha-texto', text: `Quanto você pagou por ${item.nome}? Deixe em branco se não souber.` }),
        el('div', { class: 'linha-2' }, pago.campo, estimado.campo),
        el('div', { class: 'form-botoes' },
          el('button', { type: 'button', class: 'btn btn-secundario', text: 'Cancelar', on: { click: () => folha.fechar() } }),
          el('button', { type: 'submit', class: 'btn btn-primario', text: 'Mover para a coleção' })));
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const valorPago = Modais.validarValor(pago);
        const valorEstimado = Modais.validarValor(estimado);
        if (Number.isNaN(valorPago) || Number.isNaN(valorEstimado)) {
          form.querySelector('[aria-invalid="true"]').focus();
          return;
        }
        if (!Estado.mover(id, 'wishlist', 'colecao', { valorPago, valorEstimado })) return;
        folha.fechar();
        Toast.ok('Movido para a coleção');
      });
      folha = Folha.abrir({ rotulo: 'Mover para a coleção', conteudo: [el('h2', { text: 'Mover para a coleção' }), form] });
    },
  };

  /* =======================================================
     BACKUP
     ======================================================= */
  const Backup = {
    montarArquivo() {
      const dados = {
        app: 'funko-tracker',
        versao: 2,
        exportadoEm: new Date().toISOString(),
        colecao: Estado.listas.colecao,
        wishlist: Estado.listas.wishlist,
        series: Estado.listas.series,
      };
      const nome = `funko-tracker-backup-${Util.hoje()}.json`;
      const json = JSON.stringify(dados, null, 2);
      return { nome, json };
    },

    registrar() {
      Storage.gravarTexto(CHAVE_ULTIMO_BACKUP, new Date().toISOString());
      Render.dashboard();
      Toast.ok('Backup exportado');
    },

    baixar(nome, json) {
      const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
      const link = el('a', { href: url, download: nome, hidden: true });
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    },

    async exportar() {
      const { nome, json } = Backup.montarArquivo();
      let arquivo = null;
      try { arquivo = new File([json], nome, { type: 'application/json' }); } catch (e) { arquivo = null; }
      if (arquivo && navigator.canShare && navigator.share && navigator.canShare({ files: [arquivo] })) {
        try {
          await navigator.share({ files: [arquivo], title: 'Backup do Funko Tracker' });
          Backup.registrar();
          return;
        } catch (e) {
          if (e && e.name === 'AbortError') return;
        }
      }
      try {
        Backup.baixar(nome, json);
        Backup.registrar();
      } catch (e) {
        Toast.erro('Não foi possível gerar o arquivo. Tente de novo pelo Safari.');
      }
    },

    escolherArquivo() {
      const input = document.getElementById('arquivo-backup');
      input.value = '';
      input.click();
    },

    async importar(arquivo) {
      let dados;
      try {
        dados = JSON.parse(await Util.lerArquivoTexto(arquivo));
      } catch (e) {
        Toast.erro('Esse arquivo não é um backup válido. Escolha o .json exportado pelo Funko Tracker.');
        return;
      }
      if (!dados || typeof dados !== 'object' || (!Array.isArray(dados.colecao) && !Array.isArray(dados.wishlist))) {
        Toast.erro('Esse arquivo não é um backup válido. Escolha o .json exportado pelo Funko Tracker.');
        return;
      }
      const versao = dados.versao === undefined ? 1 : Number(dados.versao);
      if (versao !== 1 && versao !== 2) {
        Toast.erro(versao > 2
          ? 'Esse backup veio de uma versão mais nova do app. Atualize o app e tente de novo.'
          : 'Esse arquivo não é um backup válido. Escolha o .json exportado pelo Funko Tracker.');
        return;
      }
      const brutoC = Array.isArray(dados.colecao) ? dados.colecao : [];
      const brutoW = Array.isArray(dados.wishlist) ? dados.wishlist : [];
      const { colecao, wishlist } = Storage.normalizarListas(brutoC, brutoW);
      const ignorados = brutoC.length + brutoW.length - colecao.length - wishlist.length;
      const brutasS = versao === 2 && Array.isArray(dados.series) ? dados.series : [];
      const registradas = Storage.normalizarSeries(brutasS);
      const series = Storage.completarSeries(registradas, colecao, wishlist);
      const seriesIgnoradas = brutasS.length - registradas.length;
      if (!colecao.length && !wishlist.length && ignorados > 0) {
        Toast.erro('Nenhum Funko desse backup pôde ser lido. Confira se o arquivo é do Funko Tracker.');
        return;
      }

      const atuais = Estado.listas.colecao.length + Estado.listas.wishlist.length;
      const partes = [
        `O backup tem ${Util.plural(colecao.length, 'Funko', 'Funkos')} na coleção, ${wishlist.length} na wishlist e ${Util.plural(series.length, 'série', 'séries')}.`,
        versao === 1 && series.length ? 'É um backup antigo: as séries foram montadas a partir dos Funkos.' : '',
        atuais ? `Seus dados de agora (${Util.plural(atuais, 'Funko', 'Funkos')}${Estado.listas.series.length ? ` e ${Util.plural(Estado.listas.series.length, 'série', 'séries')}` : ''}) serão substituídos.` : '',
        ignorados ? `${Util.plural(ignorados, 'item inválido será ignorado', 'itens inválidos serão ignorados')}.` : '',
        seriesIgnoradas > 0 ? `${Util.plural(seriesIgnoradas, 'série inválida ou repetida será ignorada', 'séries inválidas ou repetidas serão ignoradas')}.` : '',
      ].filter(Boolean);
      const sim = await Modais.confirmar({
        titulo: 'Substituir seus dados?',
        texto: partes.join(' '),
        confirmar: 'Substituir dados',
        perigo: atuais > 0,
      });
      if (sim && Estado.substituirTudo(colecao, wishlist, series)) Toast.ok('Backup importado');
    },
  };

  /* =======================================================
     INTERAÇÕES: abas, cards e toque longo
     ======================================================= */
  const Interacoes = {
    trocarAba(aba, focar) {
      if (Estado.aba === aba) {
        dom.conteudo.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      Estado.aba = aba;
      Render.cabecalho();
      dom.conteudo.scrollTop = 0;
      dom.topo.classList.remove('rolado');
      if (focar) dom.abas.find((b) => b.dataset.aba === aba).focus();
    },

    ligarCards(grade, tipo) {
      let timer = null;
      let inicio = null;
      let alvo = null;
      let suprimirClique = false;

      const cancelar = () => {
        if (timer) { clearTimeout(timer); timer = null; }
        if (alvo) { alvo.classList.remove('pressionado'); alvo = null; }
      };

      grade.addEventListener('pointerdown', (e) => {
        suprimirClique = false;
        const card = e.target.closest('.pop');
        if (!card || e.target.closest('.pop-mais')) return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        inicio = { x: e.clientX, y: e.clientY };
        alvo = card;
        card.classList.add('pressionado');
        timer = setTimeout(() => {
          timer = null;
          suprimirClique = true;
          const id = card.dataset.id;
          cancelar();
          Modais.acoes(tipo, id);
        }, TOQUE_LONGO_MS);
      });
      grade.addEventListener('pointermove', (e) => {
        if (timer && inicio && Math.hypot(e.clientX - inicio.x, e.clientY - inicio.y) > 10) cancelar();
      });
      for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) grade.addEventListener(ev, cancelar);
      grade.addEventListener('contextmenu', (e) => { if (e.target.closest('.pop')) e.preventDefault(); });

      grade.addEventListener('click', (e) => {
        if (suprimirClique) {
          suprimirClique = false;
          e.preventDefault();
          e.stopPropagation();
          return;
        }
        const card = e.target.closest('.pop');
        if (!card) return;
        const id = card.dataset.id;
        if (e.target.closest('.pop-mais')) Modais.acoes(tipo, id);
        else if (e.target.closest('.pop-corpo')) {
          const item = Estado.buscar(tipo, id);
          if (item) Modais.formulario(tipo, item);
        }
      });
    },

    ligar() {
      for (const botao of dom.abas) {
        botao.addEventListener('click', () => Interacoes.trocarAba(botao.dataset.aba));
        botao.addEventListener('keydown', (e) => {
          const ordem = dom.abas.map((b) => b.dataset.aba);
          const i = ordem.indexOf(botao.dataset.aba);
          let proxima = null;
          if (e.key === 'ArrowRight') proxima = ordem[(i + 1) % ordem.length];
          else if (e.key === 'ArrowLeft') proxima = ordem[(i - 1 + ordem.length) % ordem.length];
          else if (e.key === 'Home') proxima = ordem[0];
          else if (e.key === 'End') proxima = ordem[ordem.length - 1];
          if (proxima) { e.preventDefault(); Interacoes.trocarAba(proxima, true); }
        });
      }
      dom.btnAdicionar.addEventListener('click', () => Modais.formulario(Estado.aba === 'wishlist' ? 'wishlist' : 'colecao'));
      dom.conteudo.addEventListener('scroll', () => {
        dom.topo.classList.toggle('rolado', dom.conteudo.scrollTop > 4);
      }, { passive: true });
      document.getElementById('arquivo-backup').addEventListener('change', (e) => {
        const arquivo = e.target.files && e.target.files[0];
        if (arquivo) Backup.importar(arquivo);
      });
    },
  };

  /* =======================================================
     INICIALIZAÇÃO
     ======================================================= */
  function iniciar() {
    Render.montar();
    const { colecao, wishlist, series, gravarSeries } = Storage.carregarTudo();
    Estado.listas.colecao = colecao;
    Estado.listas.wishlist = wishlist;
    Estado.listas.series = series;
    if (gravarSeries) Storage.gravar(CHAVES.series, series);
    Interacoes.ligar();
    Render.tudo();
    if (!Storage.disponivel()) {
      Toast.erro('O navegador bloqueou o armazenamento. Saia da navegação privada para salvar seus Funkos.');
    }
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(() => { /* o app segue funcionando online */ });
      });
    }
  }

  iniciar();
})();
</script>
